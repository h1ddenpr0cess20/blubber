name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo.
permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the floor in `engines`.
        node: ['22.12', '24']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The build has to be a page that loads its own script, wherever it is served from.
      - name: Smoke test the build
        run: |
          npx vite preview --port 4173 &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "http://127.0.0.1:4173/" && break
            sleep 0.25
          done
          page=$(curl -sf "http://127.0.0.1:4173/")
          script=$(echo "$page" | grep -o 'src="[^"]*\.js"' | head -1 | sed 's/src="\(.*\)"/\1/')
          test -n "$script"
          curl -sf -o /dev/null "http://127.0.0.1:4173/${script#./}"
